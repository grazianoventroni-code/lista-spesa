<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lista Spesa</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Spesa">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#2f8f5b">
<style>
  :root { --bg:#f6f7f4; --card:#fff; --ink:#1d2a22; --mute:#7a867e; --green:#2f8f5b; --line:#e3e7e1; --red:#d6453d; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14181555; --bg:#141815; --card:#1e2420; --ink:#eef2ee; --mute:#8d9a91; --line:#2b332d; }
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; background:var(--bg); color:var(--ink); font:17px/1.35 -apple-system,system-ui,sans-serif;
         padding:env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 24px); }
  .wrap { max-width:560px; margin:0 auto; padding:0 16px; }
  header { display:flex; align-items:center; justify-content:space-between; padding:18px 0 10px; }
  h1 { font-size:26px; margin:0; }
  .icon-btn { background:none; border:0; font-size:22px; padding:8px; color:var(--mute); cursor:pointer; }
  .add { display:flex; gap:8px; position:sticky; top:0; background:var(--bg); padding:8px 0 12px; z-index:2; }
  .add input { flex:1; min-width:0; font:inherit; padding:14px 16px; border-radius:14px; border:1px solid var(--line);
               background:var(--card); color:var(--ink); }
  .btn { border:0; border-radius:14px; width:52px; font-size:22px; cursor:pointer; background:var(--green); color:#fff; }
  .btn.mic { background:var(--card); border:1px solid var(--line); color:var(--ink); }
  .btn.mic.on { background:var(--red); color:#fff; animation:pulse 1s infinite; }
  @keyframes pulse { 50% { opacity:.6; } }
  .quick { display:flex; gap:8px; overflow-x:auto; padding:2px 0 14px; scrollbar-width:none; }
  .quick::-webkit-scrollbar { display:none; }
  .chip { flex:none; background:var(--card); border:1px solid var(--line); border-radius:999px; padding:8px 14px;
          font:inherit; color:var(--ink); cursor:pointer; }
  ul { list-style:none; margin:0; padding:0; background:var(--card); border-radius:16px; border:1px solid var(--line); overflow:hidden; }
  li { display:flex; align-items:center; gap:12px; padding:13px 14px; border-bottom:1px solid var(--line); }
  li:last-child { border-bottom:0; }
  li .e { font-size:24px; width:30px; text-align:center; }
  li .n { flex:1; min-width:0; overflow-wrap:anywhere; }
  li.done .n { text-decoration:line-through; color:var(--mute); }
  li.done .e { opacity:.4; }
  .check { width:26px; height:26px; border-radius:50%; border:2px solid var(--line); background:none; flex:none; cursor:pointer;
           color:#fff; font-size:15px; line-height:1; }
  li.done .check { background:var(--green); border-color:var(--green); }
  .del { background:none; border:0; color:var(--mute); font-size:18px; padding:6px; cursor:pointer; }
  .empty { text-align:center; color:var(--mute); padding:36px 16px; }
  .foot { display:flex; justify-content:center; padding:16px 0; }
  .link { background:none; border:0; color:var(--mute); font:inherit; font-size:15px; text-decoration:underline; cursor:pointer; padding:8px 12px; }
  .status { text-align:center; color:var(--mute); font-size:13px; min-height:18px; }
  .notice { background:#fff4d6; color:#5a4500; border-radius:14px; padding:14px; margin:12px 0; font-size:15px; }
  dialog { border:0; border-radius:18px; padding:22px; max-width:420px; width:calc(100% - 32px); background:var(--card); color:var(--ink); }
  dialog::backdrop { background:#0006; }
  dialog h2 { margin:0 0 8px; font-size:20px; }
  dialog p { color:var(--mute); font-size:15px; margin:8px 0; }
  dialog input { width:100%; font:inherit; padding:12px; border-radius:12px; border:1px solid var(--line); background:var(--bg); color:var(--ink); }
  .row { display:flex; gap:8px; margin-top:14px; flex-wrap:wrap; }
  .row button { flex:1; font:inherit; padding:12px; border-radius:12px; border:1px solid var(--line); background:var(--card); color:var(--ink); cursor:pointer; }
  .row button.p { background:var(--green); color:#fff; border-color:var(--green); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🛒 Spesa</h1>
    <button class="icon-btn" id="shareBtn" title="Condividi">👥</button>
  </header>

  <div id="notice"></div>

  <form class="add" id="form" autocomplete="off">
    <input id="inp" placeholder="Cosa devi comprare?" enterkeyhint="done" autocapitalize="sentences">
    <button type="button" class="btn mic" id="mic" title="Detta">🎤</button>
    <button class="btn" title="Aggiungi">＋</button>
  </form>

  <div class="quick" id="quick"></div>
  <div class="status" id="status"></div>
  <ul id="list"></ul>
  <div class="foot"><button class="link" id="clear" hidden>Elimina le voci già prese</button></div>
</div>

<dialog id="dlg">
  <h2>Condividi la lista</h2>
  <p>Manda questo link a chi vuoi: aprendolo vedrà e potrà modificare la stessa lista. Chi ha il link ha accesso, quindi mandalo solo a persone fidate.</p>
  <input id="shareLink" readonly>
  <div class="row">
    <button class="p" id="copyBtn">Copia link</button>
    <button id="nativeShare">Invia…</button>
  </div>
  <p style="margin-top:18px">Hai ricevuto un link o un codice? Incollalo qui per unirti a un'altra lista:</p>
  <input id="joinInp" placeholder="Link o codice lista">
  <div class="row">
    <button id="joinBtn">Unisciti</button>
    <button id="closeBtn">Chiudi</button>
  </div>
</dialog>

<script src="config.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const UUID = /[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/i;

// ---- Lista corrente: dal link (?l=...) oppure salvata, oppure nuova ----
function loadListId() {
  const fromUrl = new URLSearchParams(location.search).get("l");
  if (fromUrl && UUID.test(fromUrl)) {
    localStorage.setItem("listId", fromUrl.match(UUID)[0]);
    history.replaceState(null, "", location.pathname);
  }
  let id = localStorage.getItem("listId");
  if (!id) { id = crypto.randomUUID(); localStorage.setItem("listId", id); }
  return id;
}
let LIST = loadListId();

// ---- Emoji automatiche ----
const EMOJI = [
  [/uov/, "🥚"], [/latt/, "🥛"], [/pane|panini|focaccia/, "🍞"], [/past|spaghet|penne|riso/, "🍝"],
  [/formagg|parmigian|mozzarell/, "🧀"], [/carn|bistecc|pollo|salsicc|prosciutt/, "🥩"], [/pesc|tonno|salmon/, "🐟"],
  [/mel[ae]/, "🍎"], [/banan/, "🍌"], [/arancl?|limon|agrum/, "🍊"], [/pomodor|passata/, "🍅"], [/insalat|verdur|zucchin|spinac/, "🥬"],
  [/patat/, "🥔"], [/carot/, "🥕"], [/cipoll|aglio/, "🧅"], [/acqua/, "💧"], [/vino|birra|prosecco/, "🍷"],
  [/caff/, "☕"], [/biscott|merend|dolc|cioccolat|nutella/, "🍪"], [/gelat/, "🍦"], [/olio/, "🫒"], [/burro/, "🧈"],
  [/carta|scottex|tovagliol/, "🧻"], [/detersiv|sapone|shampoo|bagno/, "🧴"], [/pannolin/, "👶"], [/cane|gatto|crocchett/, "🐾"],
];
const guessEmoji = (t) => { t = t.toLowerCase(); for (const [re, e] of EMOJI) if (re.test(t)) return e; return "🛒"; };

const QUICK = ["Uova", "Latte", "Pane", "Pasta", "Frutta", "Verdura", "Acqua", "Caffè", "Carta igienica"];
$("quick").innerHTML = QUICK.map((q) => `<button class="chip" data-q="${q}">${guessEmoji(q)} ${q}</button>`).join("");
$("quick").onclick = (e) => { const q = e.target.closest("[data-q]")?.dataset.q; if (q) add([q]); };

// ---- Server (Supabase, funzioni RPC) ----
const configured = window.CONFIG && !window.CONFIG.SUPABASE_URL.startsWith("INCOLLA");
async function rpc(fn, args) {
  const r = await fetch(`${CONFIG.SUPABASE_URL}/rest/v1/rpc/${fn}`, {
    method: "POST",
    headers: { "Content-Type": "application/json", apikey: CONFIG.SUPABASE_KEY, Authorization: `Bearer ${CONFIG.SUPABASE_KEY}` },
    body: JSON.stringify(args),
  });
  if (!r.ok) throw new Error(await r.text());
  const t = await r.text();
  return t ? JSON.parse(t) : null;
}

let items = [];
function render() {
  const ul = $("list");
  if (!items.length) { ul.outerHTML = `<ul id="list"><li class="empty" style="display:block">La lista è vuota 🎉<br>Aggiungi qualcosa qui sopra.</li></ul>`; }
  else {
    ul.innerHTML = items.map((i) => `
      <li class="${i.done ? "done" : ""}" data-id="${i.id}">
        <button class="check" data-act="toggle">${i.done ? "✓" : ""}</button>
        <span class="e">${i.emoji || "🛒"}</span>
        <span class="n"></span>
        <button class="del" data-act="del" title="Elimina">✕</button>
      </li>`).join("");
    ul.querySelectorAll("li").forEach((li, idx) => (li.querySelector(".n").textContent = items[idx].name));
  }
  $("clear").hidden = !items.some((i) => i.done);
}
// il <ul> può essere stato sostituito: riaggancia i click sul contenitore stabile
document.querySelector(".wrap").addEventListener("click", async (e) => {
  const btn = e.target.closest("[data-act]"); if (!btn) return;
  const id = +btn.closest("li").dataset.id;
  const it = items.find((x) => x.id === id);
  if (btn.dataset.act === "toggle") { it.done = !it.done; items.sort(sortFn); render(); await safe(() => rpc("set_done", { p_list: LIST, p_id: id, p_done: it.done })); }
  if (btn.dataset.act === "del") { items = items.filter((x) => x.id !== id); render(); await safe(() => rpc("delete_item", { p_list: LIST, p_id: id })); }
});
const sortFn = (a, b) => a.done - b.done || new Date(b.created_at) - new Date(a.created_at);

async function safe(fn) {
  try { await fn(); setStatus(""); } catch (e) { console.error(e); setStatus("⚠️ Problema di connessione, riprovo…"); }
}
function setStatus(s) { $("status").textContent = s; }

async function refresh() {
  if (!configured || document.hidden) return;
  try { items = await rpc("get_items", { p_list: LIST }); render(); setStatus(""); }
  catch (e) { console.error(e); setStatus("⚠️ Offline: i dati potrebbero non essere aggiornati"); }
}

// ---- Aggiunta (anche più voci insieme) ----
function splitItems(text) {
  return text.split(/,|;|\n|\s+e\s+/i).map((s) => s.trim().replace(/^(e|e poi|poi)\s+/i, "")).filter(Boolean)
    .map((s) => s.charAt(0).toUpperCase() + s.slice(1));
}
async function add(names) {
  if (!configured) return;
  const now = new Date().toISOString();
  const fresh = names.map((n, k) => ({ id: -Date.now() - k, name: n, emoji: guessEmoji(n), done: false, created_at: now }));
  items = [...fresh, ...items]; render();
  await safe(async () => { for (const f of fresh) await rpc("add_item", { p_list: LIST, p_name: f.name, p_emoji: f.emoji }); });
  refresh();
}
$("form").onsubmit = (e) => { e.preventDefault(); const t = $("inp").value; $("inp").value = ""; const n = splitItems(t); if (n.length) add(n); };

$("clear").onclick = async () => { items = items.filter((i) => !i.done); render(); await safe(() => rpc("clear_done", { p_list: LIST })); };

// ---- Dettatura ----
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null;
$("mic").onclick = () => {
  if (!SR) { alert("Dettatura non disponibile qui. Tocca il campo di testo e usa il microfono sulla tastiera dell'iPhone."); return; }
  if (rec) { rec.stop(); return; }
  rec = new SR(); rec.lang = "it-IT"; rec.interimResults = false;
  rec.onstart = () => $("mic").classList.add("on");
  rec.onresult = (ev) => { const n = splitItems(ev.results[0][0].transcript.replace(/[.!?]$/, "")); if (n.length) add(n); };
  rec.onerror = (ev) => { if (ev.error === "not-allowed") alert("Consenti l'uso del microfono nelle impostazioni, oppure usa il microfono della tastiera."); };
  rec.onend = () => { rec = null; $("mic").classList.remove("on"); };
  rec.start();
};

// ---- Condivisione ----
const shareUrl = () => location.origin + location.pathname + "?l=" + LIST;
$("shareBtn").onclick = () => { $("shareLink").value = shareUrl(); $("dlg").showModal(); };
$("closeBtn").onclick = () => $("dlg").close();
$("copyBtn").onclick = async () => { try { await navigator.clipboard.writeText(shareUrl()); $("copyBtn").textContent = "Copiato ✓"; } catch { $("shareLink").select(); } };
$("nativeShare").onclick = () => navigator.share ? navigator.share({ title: "Lista Spesa", text: "Entra nella nostra lista della spesa:", url: shareUrl() }) : $("copyBtn").click();
$("joinBtn").onclick = () => {
  const m = $("joinInp").value.match(UUID);
  if (!m) { alert("Link o codice non valido."); return; }
  LIST = m[0]; localStorage.setItem("listId", LIST); $("dlg").close(); $("joinInp").value = ""; refresh();
};

// ---- Avvio ----
if (!configured) {
  $("notice").innerHTML = `<div class="notice">⚙️ Manca ancora il collegamento al database: compila <b>config.js</b> con i dati di Supabase.</div>`;
}
render();
refresh();
setInterval(refresh, 4000);
document.addEventListener("visibilitychange", refresh);
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
